<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Signing you in — TorqueShed</title>
    <meta name="robots" content="noindex" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/png" href="/assets/images/favicon.png" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        background: #0D0F12;
        color: #E5E7EB;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        max-width: 480px;
        width: 100%;
        background: #111318;
        border: 1px solid #1F2937;
        border-radius: 16px;
        padding: 40px 32px;
        text-align: center;
      }
      .brand {
        font-family: 'Montserrat', sans-serif;
        font-weight: 800;
        font-size: 18px;
        color: #FFFFFF;
        margin-bottom: 24px;
        letter-spacing: -0.3px;
      }
      .spinner {
        width: 40px;
        height: 40px;
        margin: 0 auto 20px;
        border-radius: 50%;
        border: 3px solid #1F2937;
        border-top-color: #FF6B35;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      h1 {
        font-family: 'Montserrat', sans-serif;
        font-weight: 800;
        font-size: 22px;
        color: #FFFFFF;
        margin-bottom: 10px;
        letter-spacing: -0.4px;
      }
      p { font-size: 14px; color: #9CA3AF; line-height: 1.6; }
    </style>
  </head>
  <body>
    <div class="card" role="main">
      <div class="brand">TorqueShed</div>
      <div class="spinner" aria-hidden="true"></div>
      <h1>Signing you in</h1>
      <p>Hang tight — we're handing you off from OperatorOS.</p>
    </div>
    <script>
      (function () {
        try {
          var params = new URLSearchParams(window.location.search);
          var token = params.get("token");
          var redirect = params.get("redirect") || "/";
          if (token) {
            try { localStorage.setItem("torqueshed_auth_token", token); } catch (_) {}
          }
          // Strip the token from the URL before forwarding the user.
          window.location.replace(redirect);
        } catch (e) {
          window.location.replace("/");
        }
      })();
    </script>
  </body>
</html>
