<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Signing you in — TorqueShed</title>
    <meta name="robots" content="noindex" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/png" href="/assets/images/favicon.png" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        background: #0D0F12;
        color: #E5E7EB;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        max-width: 480px;
        width: 100%;
        background: #111318;
        border: 1px solid #1F2937;
        border-radius: 16px;
        padding: 40px 32px;
        text-align: center;
      }
      .brand {
        font-family: 'Montserrat', sans-serif;
        font-weight: 800;
        font-size: 18px;
        color: #FFFFFF;
        margin-bottom: 24px;
        letter-spacing: -0.3px;
      }
      .spinner {
        width: 40px;
        height: 40px;
        margin: 0 auto 20px;
        border-radius: 50%;
        border: 3px solid #1F2937;
        border-top-color: #FF6B35;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      h1 {
        font-family: 'Montserrat', sans-serif;
        font-weight: 800;
        font-size: 22px;
        color: #FFFFFF;
        margin-bottom: 10px;
        letter-spacing: -0.4px;
      }
      p { font-size: 14px; color: #9CA3AF; line-height: 1.6; }
    </style>
  </head>
  <body>
    <div class="card" role="main">
      <div class="brand">TorqueShed</div>
      <div class="spinner" aria-hidden="true"></div>
      <h1>Signing you in</h1>
      <p>Hang tight — we're handing you off from OperatorOS.</p>
    </div>
    <script>
      (function () {
        // Only forward to internal, same-origin paths. Anything that doesn't
        // start with a single "/" (and crucially, not "//" or a backslash, both
        // of which browsers can interpret as protocol-relative URLs to another
        // host) is rejected and we fall back to the app root. This prevents
        // /sso/bridge from being abused as an open redirect.
        function safeRedirect(value) {
          if (typeof value !== "string" || value.length === 0) return null;
          if (value[0] !== "/") return null;
          if (value[1] === "/" || value[1] === "\\") return null;
          return value;
        }
        try {
          var params = new URLSearchParams(window.location.search);
          var token = params.get("token");
          var redirect = safeRedirect(params.get("redirect"));
          if (!token) {
            window.location.replace(redirect || "/");
            return;
          }
          // Persist for the web app — AuthContext also reads this key, so a
          // user who lands on the web build is signed in immediately.
          try { localStorage.setItem("torqueshed_auth_token", token); } catch (_) {}
          // Try to bounce a mobile-browser user into the native app via the
          // custom URL scheme. If the scheme isn't registered (desktop, web
          // build, no native app installed) this navigation no-ops and the
          // setTimeout fallback below forwards them to the web app with the
          // ssoToken in the query so AuthContext can pick it up and strip it.
          var deepLink = "torqueshed://sso?token=" + encodeURIComponent(token);
          var webFallback =
            (redirect || "/") +
            ((redirect || "/").indexOf("?") === -1 ? "?" : "&") +
            "ssoToken=" + encodeURIComponent(token);
          var bouncedToWeb = false;
          setTimeout(function () {
            if (bouncedToWeb) return;
            bouncedToWeb = true;
            window.location.replace(webFallback);
          }, 600);
          try { window.location.href = deepLink; } catch (_) { /* ignored */ }
        } catch (e) {
          window.location.replace("/");
        }
      })();
    </script>
  </body>
</html>
